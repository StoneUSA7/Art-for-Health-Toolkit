<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art for Health Toolkit</title>
    <style>
        /* BASE & AESTHETIC (mrdoob inspired minimalism) */
        :root {
            --bg: #f8f9fa;
            --text: #111;
            --accent: #d0d0d0;
            --highlight: #0055ff;
            --font-main: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* HOME / DIRECTORY VIEW */
        #directory {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            transition: opacity 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 10;
        }

        header { margin-bottom: 40px; max-width: 800px; }
        header h1 { font-size: 24px; font-weight: 500; letter-spacing: -0.5px; margin-bottom: 5px; }
        header .author { font-family: var(--font-mono); font-size: 11px; color: #888; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        header p { font-size: 14px; color: #666; line-height: 1.5; }

        #grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
        }

        .item-link {
            padding: 25px 20px;
            border: 1px solid var(--accent);
            cursor: pointer;
            background: #fff;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
            position: relative;
            overflow: hidden;
        }

        .item-link::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--text); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1;
        }

        .item-link:hover { border-color: var(--text); transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .item-link:hover::after { transform: translateY(0); }
        .item-link:hover .num, .item-link:hover .title { color: #fff; position: relative; z-index: 2; }

        .item-link .num { font-family: var(--font-mono); font-size: 11px; color: #888; margin-bottom: 15px; transition: color 0.3s; letter-spacing: 1px;}
        .item-link .title { font-size: 16px; font-weight: 500; transition: color 0.3s; }

        .footer-mark { margin-top: 50px; text-align: center; font-family: var(--font-mono); font-size: 10px; color: #ccc; width: 100%; max-width: 1200px; padding-bottom: 20px; letter-spacing: 2px;}

        /* APP / CANVAS VIEW */
        #app-view {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; background: #fff; opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease; z-index: 20;
        }

        #app-view.active { opacity: 1; pointer-events: all; }

        #rubric-panel {
            width: 320px; background: var(--bg); border-right: 1px solid var(--accent);
            padding: 40px 30px; display: flex; flex-direction: column; overflow-y: auto;
            box-shadow: 2px 0 20px rgba(0,0,0,0.03); z-index: 30;
        }

        .back-btn {
            font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; margin-bottom: 50px; display: inline-block; align-self: flex-start;
            padding: 8px 12px; border: 1px solid var(--accent); border-radius: 4px; transition: all 0.2s;
        }
        .back-btn:hover { background: var(--text); color: #fff; border-color: var(--text); }

        .rubric-content h2 { font-size: 22px; margin-bottom: 30px; font-weight: 500; letter-spacing: -0.5px;}
        .rubric-section { margin-bottom: 25px; }
        .rubric-section h3 { font-size: 10px; text-transform: uppercase; color: #888; margin-bottom: 8px; font-family: var(--font-mono); letter-spacing: 1px; border-bottom: 1px solid #ddd; padding-bottom: 4px;}
        .rubric-section p { font-size: 14px; line-height: 1.6; color: #333;}

        /* MOBILE OPTIMIZATIONS: touch-action: none prevents scrolling while dragging */
        #canvas-container { flex-grow: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #fff; }
        canvas, .metaball-wrap, .mm-node, .card-container { touch-action: none; }
        .full-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* --- APP SPECIFIC UI --- */
        /* Dump */
        #dump-ui { display: flex; flex-direction: column; width: 80%; max-width: 600px; z-index: 2; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); transition: opacity 0.3s;}
        #dump-text { width: 100%; height: 150px; padding: 20px; font-family: var(--font-main); font-size: 24px; border: 2px solid #eee; resize: none; margin-bottom: 20px; outline: none; background: rgba(255,255,255,0.9); box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-radius: 8px; transition: border-color 0.3s; touch-action: auto;}
        #dump-text:focus { border-color: #ccc; }
        #dump-btn { padding: 15px; background: #111; color: #fff; border: none; cursor: pointer; font-family: var(--font-mono); font-size: 14px; letter-spacing: 1px; border-radius: 8px; transition: transform 0.1s; }
        #dump-btn:active { transform: scale(0.98); }
        .physics-letter { position: absolute; font-family: var(--font-main); font-weight: bold; font-size: 24px; color: #111; pointer-events: none; }

        /* Cards */
        .card-container { perspective: 1200px; width: 320px; height: 450px; cursor: pointer; z-index: 2;}
        .card { width: 100%; height: 100%; transition: transform 0.1s ease-out; transform-style: preserve-3d; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.1); border-radius: 12px;}
        .card-inner { width: 100%; height: 100%; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; position: relative; }
        .card.is-flipped .card-inner { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; padding: 40px; text-align: center; background: #fff; border-radius: 12px; overflow: hidden;}
        .card-back { transform: rotateY(180deg); background: #111; color: #fff; font-size: 22px; line-height: 1.5; font-weight: 500;}
        .card-front { background: #f0f0f0; font-family: var(--font-mono); font-size: 24px; letter-spacing: 2px; color: #333;}
        .card-glare { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.8), transparent 60%); opacity: 0; transition: opacity 0.2s; pointer-events: none; mix-blend-mode: overlay;}

        /* Mind Map */
        .mm-node { position: absolute; padding: 12px 20px; background: #fff; border: 2px solid #111; border-radius: 30px; cursor: grab; user-select: none; font-size: 14px; font-weight: 500; box-shadow: 4px 4px 0 #111; transition: box-shadow 0.1s, transform 0.1s; z-index: 2;}
        .mm-node:active { cursor: grabbing; box-shadow: 1px 1px 0 #111; transform: translate(3px, 3px); }

        /* Metaballs Container */
        .metaball-wrap { width: 100%; height: 100%; background: #fff; filter: contrast(30); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;}
        .m-blob { position: absolute; background: #000; border-radius: 50%; filter: blur(20px); top: 50%; left: 50%; transform: translate(-50%, -50%);}
        .m-main { width: 150px; height: 150px; cursor: pointer; }

        /* Audio */
        #audio-controls { position: absolute; bottom: 50px; text-align: center; z-index: 2; }
        .audio-btn { padding: 15px 30px; background: #111; color: #fff; border: none; cursor: pointer; border-radius: 30px; font-family: var(--font-mono); letter-spacing: 1px; transition: transform 0.2s;}
        .audio-btn:hover { transform: scale(1.05); }

        @media (max-width: 768px) {
            #app-view { flex-direction: column-reverse; }
            #rubric-panel { width: 100%; height: 40%; border-right: none; border-top: 1px solid var(--accent); padding: 20px; }
            #canvas-container { height: 60%; }
            #grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="directory">
        <header>
            <h1>Art for Health Toolkit</h1>
            <div class="author">By Darwin</div>
            <p>A digital social prescription project designed to combat academic burnout. 15 interactive, physics-driven interventions. Click any module to begin.</p>
        </header>
        <div id="grid"></div>
        <div class="footer-mark">M <span style="color: #ff6b6b;">&hearts;</span></div>
    </div>

    <div id="app-view">
        <div id="rubric-panel">
            <div class="back-btn" onclick="closeApp()">← Return to Directory</div>
            <div class="rubric-content">
                <h2 id="rubric-title">Title</h2>
                <div class="rubric-section">
                    <h3>The Purpose</h3>
                    <p id="rubric-purpose">...</p>
                </div>
                <div class="rubric-section">
                    <h3>Why Included?</h3>
                    <p id="rubric-why">...</p>
                </div>
                <div class="rubric-section">
                    <h3>Desired Effect</h3>
                    <p id="rubric-effect">...</p>
                </div>
            </div>
        </div>
        <div id="canvas-container"></div>
    </div>

<script>
    const toolkitData = [
        { id: 'breathe', title: '1. The Breathing Canvas', purpose: 'To guide the user through the 4-7-8 physiological breathing technique visually.', why: 'Stress causes shallow breathing. A visual metronome removes the cognitive load of counting.', effect: 'Lowers heart rate and activates the parasympathetic nervous system.' },
        { id: 'dump', title: '2. Cognitive Dissolve', purpose: 'A digital space to type out intrusive thoughts and watch them physically shatter.', why: 'Holding onto immediate stressors causes mental fatigue. Externalizing them creates distance.', effect: 'Provides closure, mental clarity, and reduced rumination.' },
        { id: 'gen-art', title: '3. Symmetry Sandbox', purpose: 'A generative drawing tool that creates perfect symmetry with glowing trails.', why: 'Perfectionism blocks creativity in students. This tool guarantees a beautiful outcome.', effect: 'Induces a gentle flow state and builds creative confidence.' },
        { id: 'coloring', title: '4. Recursive Stained Glass', purpose: 'A geometric fractal coloring exercise. Click to fracture and color panes.', why: 'Engaging the motor system safely with a repetitive, satisfying task grounds the brain.', effect: 'Acts as a mindfulness anchor, pulling focus away from anxiety.' },
        { id: 'cards', title: '5. Tactile Affirmations', purpose: 'A 3D digital card deck offering reframes for common student anxieties.', why: 'Students often suffer from impostor syndrome and catastrophic thinking.', effect: 'Interrupts negative self-talk with logical, visually pleasing reassurance.' },
        { id: 'mindmap', title: '6. Elastic Organizer', purpose: 'An infinite canvas to map concepts with physically stretching, elastic connections.', why: 'Overwhelm stems from disorganized information. Mapping helps the brain process volume.', effect: 'Restores a sense of control and spatial memory organization.' },
        { id: 'origami', title: '7. Morphing Geometry', purpose: 'A mathematically perfect shape that slowly morphs through states on click.', why: 'Focusing entirely on a sequence of shapes forces the brain into single-tasking.', effect: 'Breaks the cycle of multitasking and creates a visual micro-accomplishment.' },
        { id: 'texture', title: '8. Texture Reveal', purpose: 'A scratch-off canvas that reveals a fluid, organic gradient underneath.', why: 'Academic life is smooth glass screens. The brain craves the discovery of texture.', effect: 'Provides sensory grounding and a metaphor for uncovering clarity.' },
        { id: 'vision', title: '9. Fractal Growth', purpose: 'A generative algorithm where each click spawns new, organic branch growths.', why: 'Academic burnout makes the future look bleak. Visualizing growth restores perspective.', effect: 'Fosters hope and visualizes the value of compounding daily efforts.' },
        { id: 'particles', title: '10. Constellation Connect', purpose: 'A gentle interactive particle system where nodes draw webs to your cursor.', why: 'Watching organic, interconnected movement mimics natural systems.', effect: 'Promotes soft fascination, giving the active mind a place to rest.' },
        { id: 'blob', title: '11. Liquid Metaballs', purpose: 'Highly reactive, fluid digital matter that realistically merges and separates.', why: 'Restless energy needs a tactile, satisfying kinetic outlet.', effect: 'Somatic soothing and a harmless, fascinating physical distraction.' },
        { id: 'magnetic', title: '12. Vector Field', purpose: 'A grid of lines that fluidly map to the velocity and position of your mouse.', why: 'Interacting with responsive digital materials provides tactile feedback.', effect: 'Reduces frustration by offering a highly responsive environment.' },
        { id: 'balance', title: '13. Cellular Sand', purpose: 'A falling-sand simulation. Draw fluid grains that realistically pile and slide.', why: 'Adulthood lacks unstructured play. Granular physics provides deep focus.', effect: 'Encourages lightheartedness and open-ended experimentation.' },
        { id: 'asmr', title: '14. Harmonic Pendulum', purpose: 'A continuously decaying sine wave drawing with long glowing trails.', why: 'Smooth, predictable visual tracking helps regulate the nervous system.', effect: 'Hypnotic relaxation and heart rate reduction.' },
        { id: 'sound-draw', title: '15. Soundscape Sketch', purpose: 'Generates soothing procedural brown noise while providing a canvas.', why: 'Auditory masking helps eliminate distracting background noise.', effect: 'Creates a safe psychological bubble for deep focus or rest.' }
    ];

    const grid = document.getElementById('grid');
    const directory = document.getElementById('directory');
    const appView = document.getElementById('app-view');
    const canvasContainer = document.getElementById('canvas-container');
    let currentAppCleanup = null; 

    toolkitData.forEach((item, index) => {
        const el = document.createElement('div');
        el.className = 'item-link';
        el.innerHTML = `<div class="num">NO. ${(index + 1).toString().padStart(2, '0')}</div><div class="title">${item.title.split('. ')[1]}</div>`;
        el.onclick = () => openApp(item);
        grid.appendChild(el);
    });

    function openApp(item) {
        document.getElementById('rubric-title').innerText = item.title;
        document.getElementById('rubric-purpose').innerText = item.purpose;
        document.getElementById('rubric-why').innerText = item.why;
        document.getElementById('rubric-effect').innerText = item.effect;

        canvasContainer.innerHTML = '';
        if (currentAppCleanup) currentAppCleanup();
        currentAppCleanup = appInitializers[item.id]();

        directory.style.opacity = '0';
        directory.style.pointerEvents = 'none';
        appView.classList.add('active');
    }

    function closeApp() {
        if (currentAppCleanup) currentAppCleanup();
        currentAppCleanup = null;
        canvasContainer.innerHTML = '';
        appView.classList.remove('active');
        directory.style.opacity = '1';
        directory.style.pointerEvents = 'all';
    }

    // --- MINI APP IMPLEMENTATIONS (High-Performance Pointer Events) ---

    const appInitializers = {
        // 1. Breathe: Generative Particle Ring
        'breathe': () => {
            const cvs = document.createElement('canvas');
            cvs.className = 'full-canvas';
            canvasContainer.appendChild(cvs);
            const ctx = cvs.getContext('2d');
            let w, h;
            function resize() { w = cvs.width = canvasContainer.clientWidth; h = cvs.height = canvasContainer.clientHeight; }
            resize(); window.addEventListener('resize', resize);

            let state = 0; // 0:in, 1:hold, 2:out
            let timer = 4;
            let targetRadius = Math.min(w,h)*0.35;
            let currentRadius = targetRadius * 0.5;
            
            const particles = Array.from({length: 150}, () => ({
                angle: Math.random() * Math.PI * 2,
                speed: 0.002 + Math.random() * 0.005,
                offset: (Math.random() - 0.5) * 40,
                size: Math.random() * 3 + 1
            }));

            let stateText = "Breathe In";

            function runCycle() {
                if(state === 0) { targetRadius = Math.min(w,h)*0.35; timer = 4; stateText = "Breathe In"; setTimeout(() => {state=1; runCycle();}, 4000); }
                else if(state === 1) { timer = 7; stateText = "Hold"; setTimeout(() => {state=2; runCycle();}, 7000); }
                else if(state === 2) { targetRadius = Math.min(w,h)*0.15; timer = 8; stateText = "Breathe Out"; setTimeout(() => {state=0; runCycle();}, 8000); }
            }
            
            const tickInterval = setInterval(() => { if(timer > 1) timer--; }, 1000);
            setTimeout(runCycle, 100);

            let anim;
            function draw() {
                ctx.fillStyle = 'rgba(255,255,255,0.2)'; // trails
                ctx.fillRect(0,0,w,h);
                
                currentRadius += (targetRadius - currentRadius) * 0.02; // ease
                
                ctx.fillStyle = '#0055ff';
                particles.forEach(p => {
                    p.angle += p.speed;
                    let r = currentRadius + Math.sin(p.angle * 5) * p.offset;
                    let x = w/2 + Math.cos(p.angle) * r;
                    let y = h/2 + Math.sin(p.angle) * r;
                    ctx.beginPath(); ctx.arc(x,y, p.size, 0, Math.PI*2); ctx.fill();
                });

                ctx.fillStyle = '#111';
                ctx.font = '20px "Courier New"';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(`${stateText} (${timer})`, w/2, h/2);

                anim = requestAnimationFrame(draw);
            }
            draw();
            return () => { cancelAnimationFrame(anim); clearInterval(tickInterval); window.removeEventListener('resize', resize); };
        },

        // 2. Cognitive Dissolve: Rigid Body Text Shatter
        'dump': () => {
            const ui = document.createElement('div');
            ui.id = 'dump-ui';
            ui.innerHTML = `<textarea id="dump-text" placeholder="Type out an anxious thought..."></textarea><button id="dump-btn">Shatter Thought</button>`;
            canvasContainer.appendChild(ui);
            const btn = document.getElementById('dump-btn');
            const txt = document.getElementById('dump-text');
            
            let particles = [];
            let anim;

            btn.onclick = () => {
                const textStr = txt.value.trim();
                if(!textStr) return;
                
                ui.style.opacity = '0';
                setTimeout(() => ui.style.display = 'none', 300);

                // Create physics letters
                const rect = txt.getBoundingClientRect();
                const containerRect = canvasContainer.getBoundingClientRect();
                
                let cx = rect.left - containerRect.left + 20;
                let cy = rect.top - containerRect.top + 20;
                
                for(let i=0; i<textStr.length; i++) {
                    let char = textStr[i];
                    if(char === '\n') { cy += 30; cx = rect.left - containerRect.left + 20; continue; }
                    if(char === ' ') { cx += 10; continue; }

                    const el = document.createElement('div');
                    el.className = 'physics-letter';
                    el.innerText = char;
                    el.style.left = cx + 'px'; el.style.top = cy + 'px';
                    canvasContainer.appendChild(el);
                    
                    particles.push({
                        el: el, x: cx, y: cy,
                        vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 1) * 15, // burst up and out
                        rot: 0, vrot: (Math.random() - 0.5) * 20,
                        opacity: 1
                    });
                    cx += 14; 
                    if(cx > rect.right - containerRect.left - 40) { cy += 30; cx = rect.left - containerRect.left + 20; }
                }

                function physicsLoop() {
                    let active = false;
                    particles.forEach(p => {
                        if(p.opacity <= 0) return;
                        active = true;
                        p.vy += 0.4; // gravity
                        p.x += p.vx; p.y += p.vy;
                        p.rot += p.vrot;
                        
                        // Bounce off floor
                        if(p.y > canvasContainer.clientHeight - 40) {
                            p.y = canvasContainer.clientHeight - 40;
                            p.vy *= -0.6; p.vx *= 0.8; p.vrot *= 0.8;
                        }
                        // Bounce walls
                        if(p.x < 0 || p.x > canvasContainer.clientWidth - 20) p.vx *= -0.8;

                        p.opacity -= 0.005; // slow fade
                        p.el.style.transform = `translate(${p.x - parseFloat(p.el.style.left)}px, ${p.y - parseFloat(p.el.style.top)}px) rotate(${p.rot}deg)`;
                        p.el.style.opacity = p.opacity;
                    });
                    if(active) anim = requestAnimationFrame(physicsLoop);
                    else {
                        particles.forEach(p => p.el.remove());
                        ui.style.display = 'flex'; ui.style.opacity = '1'; txt.value = ''; particles = [];
                    }
                }
                physicsLoop();
            };
            return () => { cancelAnimationFrame(anim); };
        },

        // 3. Symmetry Sandbox: Glowing Trails
        'gen-art': () => {
            const cvs = document.createElement('canvas');
            cvs.className = 'full-canvas'; canvasContainer.appendChild(cvs);
            const ctx = cvs.getContext('2d');
            let w, h; function resize() { w = cvs.width = canvasContainer.clientWidth; h = cvs.height = canvasContainer.clientHeight; }
            resize(); window.addEventListener('resize', resize);

            let isDrawing = false, lastX = 0, lastY = 0, hue = 0;
            let points = [];
            
            ctx.lineJoin = 'round'; ctx.lineCap = 'round';

            function drawFrame() {
                // Fade effect
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = 'rgba(255,255,255,0.05)';
                ctx.fillRect(0,0,w,h);
                
                ctx.globalCompositeOperation = 'darken';
                
                if(isDrawing && points.length > 0) {
                    let p = points.shift();
                    ctx.strokeStyle = `hsl(${hue}, 80%, 50%)`;
                    ctx.lineWidth = 3;
                    
                    const drawLine = (x1,y1, x2,y2) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
                    // 6-way radial symmetry
                    for(let i=0; i<6; i++) {
                        ctx.save();
                        ctx.translate(w/2, h/2);
                        ctx.rotate((Math.PI * 2 / 6) * i);
                        drawLine(lastX - w/2, lastY - h/2, p.x - w/2, p.y - h/2);
                        // mirror
                        ctx.scale(-1, 1);
                        drawLine(lastX - w/2, lastY - h/2, p.x - w/2, p.y - h/2);
                        ctx.restore();
                    }
                    lastX = p.x; lastY = p.y; hue+=2;
                }
                requestAnimationFrame(drawFrame);
            }
            let anim = requestAnimationFrame(drawFrame);

            cvs.addEventListener('pointerdown', (e) => { isDrawing = true; lastX = e.offsetX; lastY = e.offsetY; });
            cvs.addEventListener('pointermove', (e) => { if(isDrawing) points.push({x: e.offsetX, y: e.offsetY}); });
            cvs.addEventListener('pointerup', () => { isDrawing = false; points=[]; });
            cvs.addEventListener('pointerout', () => { isDrawing = false; points=[]; });
            return () => { cancelAnimationFrame(anim); window.removeEventListener('resize', resize); };
        },

        // 4. Recursive Stained Glass: Fractal Quadtree
        'coloring': () => {
            const cvs = document.createElement('canvas');
            cvs.className = 'full-canvas'; canvasContainer.appendChild(cvs);
            const ctx = cvs.getContext('2d');
            let w, h; 
            
            let rects = [];
            const colors = ['#264653', '#2a9d8f', '#e9c46a', '#f4a261', '#e76f51', '#f8edeb'];

            function resize() { 
                w = cvs.width = canvasContainer.clientWidth; h = cvs.height = canvasContainer.clientHeight; 
                rects = [{x: 20, y: 20, w: w-40, h: h-40, c: '#ffffff'}]; // initial pane
                drawAll();
            }
            resize(); window.addEventListener('resize', resize);

            function drawAll() {
                ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
                ctx.lineWidth = 4; ctx.strokeStyle = '#111';
                rects.forEach(r => {
                    ctx.fillStyle = r.c;
                    ctx.fillRect(r.x, r.y, r.w, r.h);
                    ctx.strokeRect(r.x, r.y, r.w, r.h);
                });
            }

            cvs.addEventListener('pointerdown', (e) => {
                const ex = e.offsetX, ey = e.offsetY;
                // Find clicked rect
                for(let i = rects.length-1; i >= 0; i--) {
                    let r = rects[i];
                    if(ex > r.x && ex < r.x + r.w && ey > r.y && ey < r.y + r.h) {
                        if(r.w < 20 || r.h < 20) return; // Too small
                        
                        rects.splice(i, 1); // remove
                        
                        // Split into 4
                        let w2 = r.w/2, h2 = r.h/2;
                        let c1 = colors[Math.floor(Math.random()*colors.length)];
                        let c2 = colors[Math.floor(Math.random()*colors.length)];
                        let c3 = colors[Math.floor(Math.random()*colors.length)];

                const x = e.clientX - rect.left; const y = e.clientY - rect.top;
                const cx = rect.width / 2; const cy = rect.height / 2;
                const rotX = ((y - cy) / cy) * -15; // max 15 deg
                const rotY = ((x - cx) / cx) * 15;
                
                card.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) scale3d(1.05, 1.05, 1.05)`;
                glare.style.opacity = '1';

                card.style.transform = `rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;

            canvasContainer.addEventListener('pointermove', trackMove);
            canvasContainer.addEventListener('pointerleave', resetTilt);

        // 6. Elastic Organizer: Canvas connections
        'mindmap': () => {
            const cvs = document.createElement('canvas'); cvs.className = 'full-canvas'; canvasContainer.appendChild(cvs);
            const ctx = cvs.getContext('2d');
            let w, h; function resize() { w = cvs.width = canvasContainer.clientWidth; h = cvs.height = canvasContainer.clientHeight; }
            resize(); window.addEventListener('resize', resize);

            const nodes = [];
            let dragNode = null; let ox = 0, oy = 0;

            function createNode(x, y, text) {
                const el = document.createElement('div'); el.className = 'mm-node';
                el.contentEditable = true; el.innerText = text;
                el.style.left = x + 'px'; el.style.top = y + 'px';
                canvasContainer.appendChild(el);
                
                const nodeObj = { el, x, y };
                nodes.push(nodeObj);
                
                el.addEventListener('pointerdown', (e) => {
                    dragNode = nodeObj; 
                    ox = e.clientX - el.getBoundingClientRect().left; 
                    oy = e.clientY - el.getBoundingClientRect().top;
                    el.style.zIndex = 10;
                    e.stopPropagation(); // prevent canvas click
                });
                return nodeObj;
            }

            createNode(w/2 - 50, h/2 - 20, "Core Problem");

            // Custom double-tap detector for mobile support
            let lastTap = 0;
            const handleCanvasTap = (e) => {
                if(e.target !== canvasContainer && e.target !== cvs) return;
                const now = Date.now();
                if(now - lastTap < 300) {
                    createNode(e.offsetX, e.offsetY, "New Thought").el.focus();
                }
                lastTap = now;
            };
            canvasContainer.addEventListener('pointerdown', handleCanvasTap);

            const handleMove = (e) => {
                if(!dragNode) return;
                const rect = canvasContainer.getBoundingClientRect();
                dragNode.x = e.clientX - rect.left - ox;
                dragNode.y = e.clientY - rect.top - oy;
                dragNode.el.style.left = dragNode.x + 'px';
                dragNode.el.style.top = dragNode.y + 'px';
            };
            
            const handleUp = () => { if(dragNode) { dragNode.el.style.zIndex = 2; dragNode = null; } };

            window.addEventListener('pointermove', handleMove);
            window.addEventListener('pointerup', handleUp);

            let anim;
            function drawWeb() {
                ctx.clearRect(0,0,w,h);
                ctx.strokeStyle = '#ddd'; ctx.lineWidth = 2;
                
                // Draw lines from node 0 to all others
                if(nodes.length > 1) {
                    const center = nodes[0];
                    const cw = center.el.offsetWidth/2; const ch = center.el.offsetHeight/2;
                    for(let i=1; i<nodes.length; i++) {
                        const n = nodes[i];
                        const nw = n.el.offsetWidth/2; const nh = n.el.offsetHeight/2;
                        
                        // Elastic curve
                        ctx.beginPath();
                        ctx.moveTo(center.x + cw, center.y + ch);
                        // control point halfway but sagging
                        let midX = (center.x + n.x) / 2;
                        let midY = (center.y + n.y) / 2 + 50; 
                        ctx.quadraticCurveTo(midX + cw, midY + ch, n.x + nw, n.y + nh);
                        ctx.stroke();
                    }
                }
                anim = requestAnimationFrame(drawWeb);
            }
            drawWeb();

            return () => { 
                cancelAnimationFrame(anim); 
                window.removeEventListener('resize', resize);
                canvasContainer.removeEventListener('pointerdown', handleCanvasTap);
                window.removeEventListener('pointermove', handleMove);
                window.removeEventListener('pointerup', handleUp);
            };
        },

        // 7. Morphing Geometry: Canvas LERP
        'origami': () => {
            const cvs = document.createElement('canvas'); cvs.className = 'full-canvas'; canvasContainer.appendChild(cvs);
            const ctx = cvs.getContext('2d');
            let w, h; function resize() { w = cvs.width = canvasContainer.clientWidth; h = cvs.height = canvasContainer.clientHeight; }
            resize(); window.addEventListener('resize', resize);

            // States defined as radius and angle for 4 points
            const states = [
                [{r:150, a:Math.PI/4}, {r:150, a:Math.PI*3/4}, {r:150, a:Math.PI*5/4}, {r:150, a:Math.PI*7/4}], // Square
                [{r:180, a:Math.PI/2}, {r:180, a:Math.PI*7/6}, {r:0, a:0}, {r:180, a:Math.PI*11/6}], // Triangle (point folded in)
                [{r:150, a:0}, {r:150, a:Math.PI/2}, {r:150, a:Math.PI}, {r:150, a:Math.PI*3/2}], // Diamond
                [{r:200, a:Math.PI/2}, {r:100, a:Math.PI}, {r:50, a:Math.PI*3/2}, {r:100, a:0}] // Kite
            ];
            
            let sIdx = 0;
            let currentPts = JSON.parse(JSON.stringify(states[0])); // deep copy
            
            const advanceMorph = () => { sIdx = (sIdx + 1) % states.length; };
            canvasContainer.addEventListener('pointerdown', advanceMorph);

            let anim;
            function draw() {
                ctx.clearRect(0,0,w,h);
                
                const target = states[sIdx];
                // LERP
                for(let i=0; i<4; i++) {
                    currentPts[i].r += (target[i].r - currentPts[i].r) * 0.05;
                    // shortest angle path
                    let diff = target[i].a - currentPts[i].a;
                    while (diff < -Math.PI) diff += Math.PI*2;
                    while (diff > Math.PI) diff -= Math.PI*2;
                    currentPts[i].a += diff * 0.05;
                }

                ctx.translate(w/2, h/2);
                ctx.fillStyle = '#111';
                ctx.beginPath();
                for(let i=0; i<4; i++) {
                    let x = Math.cos(currentPts[i].a) * currentPts[i].r;
                    let y = Math.sin(currentPts[i].a) * currentPts[i].r;
                    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
                }
                ctx.closePath(); ctx.fill();
                ctx.translate(-w/2, -h/2);

                ctx.fillStyle = '#888'; ctx.font = '12px "Courier New"'; ctx.fillText("Tap to morph", w/2 - 40, h - 40);
                anim = requestAnimationFrame(draw);
            }
            draw();
            return () => { cancelAnimationFrame(anim); window.removeEventListener('resize', resize); canvasContainer.removeEventListener('pointerdown', advanceMorph); };
        },

        // 8. Texture Reveal: Fluid gradient scratch
        'texture': () => {

            style.innerHTML = `@keyframes gradientMove { 0% {background-position: 0% 50%;} 50% {background-position: 100% 50%;} 100% {background-position: 0% 50%;} }`;
            document.head.appendChild(style);
            canvasContainer.style.background = 'linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab)';
            canvasContainer.style.backgroundSize = '400% 400%';
            canvasContainer.style.animation = 'gradientMove 15s ease infinite';

            const cvs = document.createElement('canvas'); cvs.className = 'full-canvas'; canvasContainer.appendChild(cvs);
            const ctx = cvs.getContext('2d');
            let w = cvs.width = canvasContainer.clientWidth; let h = cvs.height = canvasContainer.clientHeight;

            ctx.fillStyle = '#f8f9fa'; ctx.fillRect(0,0,w,h);
            
            // Soft brush
            ctx.lineJoin = ctx.lineCap = 'round';
            const radGrad = ctx.createRadialGradient(0,0,10, 0,0,40);
            radGrad.addColorStop(0, '#000'); radGrad.addColorStop(1, 'rgba(0,0,0,0)');
            
            ctx.globalCompositeOperation = 'destination-out';

            let isDrawing = false, lastX=0, lastY=0;
            cvs.onpointerdown = (e) => { isDrawing = true; lastX=e.offsetX; lastY=e.offsetY; };
            cvs.onpointerup = () => isDrawing = false;
            cvs.onpointerout = () => isDrawing = false;
            cvs.onpointermove = (e) => {
                if(!isDrawing) return;
                // Draw thick line using gradient brush stamping
                let dist = Math.hypot(e.offsetX - lastX, e.offsetY - lastY);
                for(let i=0; i<dist; i+=5) {
                    let lx = lastX + (e.offsetX - lastX) * (i/dist);
                    let ly = lastY + (e.offsetY - lastY) * (i/dist);
                    ctx.save(); ctx.translate(lx, ly); ctx.fillStyle = radGrad; ctx.beginPath(); ctx.arc(0,0,40,0,Math.PI*2); ctx.fill(); ctx.restore();
                }
                lastX = e.offsetX; lastY = e.offsetY;
            };

            return () => { document.getElementById('texture-style').remove(); canvasContainer.style.background = '#fff'; canvasContainer.style.animation = ''; };
        },

        // 9. Fractal Growth: L-System inspired
        'vision': () => {
            const cvs = document.createElement('canvas'); cvs.className = 'full-canvas'; canvasContainer.appendChild(cvs);
            const ctx = cvs.getContext('2d');
            let w, h; function resize() { w = cvs.width = canvasContainer.clientWidth; h = cvs.height = canvasContainer.clientHeight; }
            resize(); window.addEventListener('resize', resize);

            let branches = [];
            // Init root
            branches.push({ x: w/2, y: h, angle: -Math.PI/2, len: 0, targetLen: 120, gen: 0, done: false });

            const expandTree = () => {
                let newBranches = [];
                branches.forEach(b => {
                    if(b.gen > 6) return; // max depth
                    if(!b.hasSplit && b.len > b.targetLen * 0.8) {
                        b.hasSplit = true;
                        let endX = b.x + Math.cos(b.angle) * b.targetLen;
                        let endY = b.y + Math.sin(b.angle) * b.targetLen;
                        newBranches.push({ x: endX, y: endY, angle: b.angle - 0.5 + Math.random()*0.2, len: 0, targetLen: b.targetLen * 0.75, gen: b.gen+1 });
                        newBranches.push({ x: endX, y: endY, angle: b.angle + 0.5 - Math.random()*0.2, len: 0, targetLen: b.targetLen * 0.75, gen: b.gen+1 });
                    }
                });
                branches = branches.concat(newBranches);
            };
            canvasContainer.addEventListener('pointerdown', expandTree);

            let anim;
            function draw() {
                ctx.clearRect(0,0,w,h);
                branches.forEach(b => {
                    b.len += (b.targetLen - b.len) * 0.1; // grow
                    let endX = b.x + Math.cos(b.angle) * b.len;
                    let endY = b.y + Math.sin(b.angle) * b.len;
                    
                    ctx.beginPath();
                    ctx.moveTo(b.x, b.y); ctx.lineTo(endX, endY);
                    ctx.strokeStyle = '#2d6a4f';
                    ctx.lineWidth = Math.max(1, 10 - b.gen * 1.5);
                    ctx.lineCap = 'round';
                    ctx.stroke();

                    // draw leaf if end of branch
                    if(b.gen > 0 && Math.abs(b.len - b.targetLen) < 1) {
                        ctx.fillStyle = '#40916c';
                        ctx.beginPath();
                        ctx.ellipse(endX, endY, 8 - b.gen, 4 - b.gen/2, b.angle, 0, Math.PI*2);
                        ctx.fill();
                    }
                });
                anim = requestAnimationFrame(draw);
            }
            draw();
            return () => { cancelAnimationFrame(anim); window.removeEventListener('resize', resize); canvasContainer.removeEventListener('pointerdown', expandTree); };
        },

        // 10. Constellation Connect
        'particles': () => {
            const cvs = document.createElement('canvas'); cvs.className = 'full-canvas'; canvasContainer.appendChild(cvs);
            const ctx = cvs.getContext('2d');
            let w, h; function resize() { w = cvs.width = canvasContainer.clientWidth; h = cvs.height = canvasContainer.clientHeight; }
            resize(); window.addEventListener('resize', resize);

            const pts = [];
            for(let i=0; i<100; i++) pts.push({x: Math.random()*w, y: Math.random()*h, vx: (Math.random()-0.5)*1, vy: (Math.random()-0.5)*1});
            
            let mouse = {x: -1000, y: -1000};
            cvs.onpointermove = e => { mouse.x = e.offsetX; mouse.y = e.offsetY; };
            cvs.onpointerleave = () => { mouse.x = -1000; mouse.y = -1000; };

            let anim;
            function draw() {
                ctx.clearRect(0,0,w,h);
                ctx.fillStyle = '#666';
                pts.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    if(p.x < 0 || p.x > w) p.vx *= -1;
                    if(p.y < 0 || p.y > h) p.vy *= -1;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
                });
                
                for(let i=0; i<pts.length; i++) {
                    let dMouse = Math.hypot(pts[i].x - mouse.x, pts[i].y - mouse.y);
                    if(dMouse < 180) {
                        ctx.strokeStyle = `rgba(0, 85, 255, ${1 - dMouse/180})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
                        // Slight attraction
                        pts[i].vx += (mouse.x - pts[i].x) * 0.0002;
                        pts[i].vy += (mouse.y - pts[i].y) * 0.0002;
                    }
                    for(let j=i+1; j<pts.length; j++) {
                        let d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
                        if(d < 70) {
                            ctx.strokeStyle = `rgba(200, 200, 200, ${1 - d/70})`;
                            ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke();
                        }
                    }
                }
                anim = requestAnimationFrame(draw);
            }
            draw();
            return () => { cancelAnimationFrame(anim); window.removeEventListener('resize', resize); };
        },

        // 12. Vector Field
        'magnetic': () => {
            const cvs = document.createElement('canvas'); cvs.className = 'full-canvas'; canvasContainer.appendChild(cvs);
            const ctx = cvs.getContext('2d');
            let w, h; function resize() { w = cvs.width = canvasContainer.clientWidth; h = cvs.height = canvasContainer.clientHeight; }

            const spacing = 30;
            let mouse = {x: -1000, y: -1000};
            cvs.onpointermove = e => { mouse.x = e.offsetX; mouse.y = e.offsetY; };

                ctx.strokeStyle = '#333'; ctx.lineCap = 'round';

                        let dist = Math.hypot(dx, dy);

        // 13. Cellular Sand Simulation
        'balance': () => {
            const cvs = document.createElement('canvas'); cvs.className = 'full-canvas'; canvasContainer.appendChild(cvs);
            const ctx = cvs.getContext('2d');
            
            const cols = 100; const rows = 80;
            let w, h, cellW, cellH;
            function resize() { 
                w = cvs.width = canvasContainer.clientWidth; h = cvs.height = canvasContainer.clientHeight; 
                cellW = w / cols; cellH = h / rows;
            }
            resize(); window.addEventListener('resize', resize);

            let grid = new Array(cols).fill(0).map(() => new Array(rows).fill(0)); 
            
            let isDrawing = false; let mouse = {x:0, y:0}; let hue = 40;
            cvs.onpointerdown = (e) => { isDrawing = true; mouse.x = e.offsetX; mouse.y = e.offsetY; };
            cvs.onpointerup = () => { isDrawing = false; hue = (hue + 20) % 360; };
            cvs.onpointerout = () => { isDrawing = false; };
            cvs.onpointermove = (e) => { if(isDrawing){ mouse.x = e.offsetX; mouse.y = e.offsetY; } };

            let anim;
            function loop() {
                // Add sand
                if(isDrawing) {
                    let gx = Math.floor(mouse.x / cellW); let gy = Math.floor(mouse.y / cellH);
                    for(let i=-2; i<=2; i++) {
                        for(let j=-2; j<=2; j++) {
                            if(Math.random() < 0.5 && gx+i >= 0 && gx+i < cols && gy+j >= 0 && gy+j < rows) {
                                if(grid[gx+i][gy+j] === 0) grid[gx+i][gy+j] = hue + Math.random()*20; 
                            }
                        }
                    }
                }

                // Simulate bottom up
                for(let y = rows-2; y >= 0; y--) {
                    let dir = Math.random() < 0.5 ? 1 : -1;
                    for(let x = 0; x < cols; x++) {
                        let cX = dir === 1 ? x : cols - 1 - x; 
                        let val = grid[cX][y];
                        if(val > 0) {
                            if(grid[cX][y+1] === 0) { 
                                grid[cX][y+1] = val; grid[cX][y] = 0;
                            } else if(cX > 0 && grid[cX-1][y+1] === 0) { 
                                grid[cX-1][y+1] = val; grid[cX][y] = 0;
                            } else if(cX < cols-1 && grid[cX+1][y+1] === 0) { 
                                grid[cX+1][y+1] = val; grid[cX][y] = 0;
                            }
                        }
                    }
                }

                // Draw
                ctx.fillStyle = '#f8f9fa'; ctx.fillRect(0,0,w,h);
                for(let x=0; x<cols; x++) {
                    for(let y=0; y<rows; y++) {
                        if(grid[x][y] > 0) {
                            ctx.fillStyle = `hsl(${grid[x][y]}, 60%, 50%)`;
                            ctx.fillRect(x*cellW, y*cellH, cellW+0.5, cellH+0.5); 
                        }
                    }
                }
                
                ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.font = '12px monospace';
                ctx.fillText("Drag to pour sand", 20, 30);

                anim = requestAnimationFrame(loop);
            }
            loop();
            return () => { cancelAnimationFrame(anim); window.removeEventListener('resize', resize); };
        },

        // 14. Harmonic Pendulum: Glowing trails

            const ctx = cvs.getContext('2d');
            let w = cvs.width = canvasContainer.clientWidth; let h = cvs.height = canvasContainer.clientHeight;

            let t = 0;
            const f1 = 2.01, f2 = 3, p1 = Math.PI/2, p2 = 0, d = 0.0005;
            const amp = Math.min(w,h) * 0.45;

            ctx.fillStyle = '#111'; ctx.fillRect(0,0,w,h); 
            ctx.translate(w/2, h/2);
            ctx.globalCompositeOperation = 'lighter';
            
            let anim;
            function draw() {
                ctx.beginPath();
                for(let i=0; i<20; i++) { 
                    let x = amp * Math.sin(t * f1 + p1) * Math.exp(-d * t);
                    let y = amp * Math.sin(t * f2 + p2) * Math.exp(-d * t);
                    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
                    t += 0.02;
                }
                ctx.strokeStyle = `hsla(${(t*10)%360}, 80%, 50%, 0.3)`;
                ctx.lineWidth = 1;
                ctx.stroke();

                if(t < 200) anim = requestAnimationFrame(draw);
            }
            draw();
            return () => { cancelAnimationFrame(anim); };
        },

        // 15. Soundscape Sketch: Audio ripples
        'sound-draw': () => {
            let audioCtx = null, noiseNode = null, filterNode = null, isPlaying = false;
            const ui = document.createElement('div'); ui.id = 'audio-controls';
            ui.innerHTML = `<button class="audio-btn">Play Brown Noise</button>`;
            canvasContainer.appendChild(ui); const btn = ui.querySelector('button');

            const cvs = document.createElement('canvas'); cvs.className = 'full-canvas'; canvasContainer.appendChild(cvs);
            const ctx = cvs.getContext('2d');
            let w = cvs.width = canvasContainer.clientWidth; let h = cvs.height = canvasContainer.clientHeight;

            let isDrawing = false; let ripples = [];
            ctx.strokeStyle = '#0055ff'; ctx.lineWidth = 2; ctx.lineCap = 'round';
            
            cvs.onpointerdown = (e) => { isDrawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); };
            cvs.onpointermove = (e) => { 
                if(isDrawing) { 
                    ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); 
                    if(isPlaying && Math.random() < 0.1) ripples.push({x: e.offsetX, y: e.offsetY, r: 0});
                } 
            };
            cvs.onpointerup = () => isDrawing = false;
            cvs.onpointerout = () => isDrawing = false;
            
            let anim;
            function loop() {
                if(isPlaying && ripples.length > 0) {
                    ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(0,0,w,h); 
                    ripples.forEach((r, i) => {
                        r.r += 2; 
                        ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI*2);
                        ctx.strokeStyle = `rgba(0, 85, 255, ${Math.max(0, 1 - r.r/100)})`;
                        ctx.stroke();
                        if(r.r > 100) ripples.splice(i, 1);
                    });
                }
                anim = requestAnimationFrame(loop);
            }
            loop();

            btn.onclick = () => {
                if(!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const bufferSize = audioCtx.sampleRate * 2;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const output = buffer.getChannelData(0);
                    let lastOut = 0;
                    for (let i = 0; i < bufferSize; i++) {
                        let white = Math.random() * 2 - 1;
                        output[i] = (lastOut + (0.02 * white)) / 1.02;
                        lastOut = output[i];
                        output[i] *= 3.5;
                    }
                    noiseNode = audioCtx.createBufferSource(); noiseNode.buffer = buffer; noiseNode.loop = true;
                    filterNode = audioCtx.createBiquadFilter(); filterNode.type = 'lowpass'; filterNode.frequency.value = 400;
                    noiseNode.connect(filterNode); filterNode.connect(audioCtx.destination);
                    noiseNode.start(0);
                    isPlaying = true; btn.innerText = 'Stop Noise';
                } else {
                    if(audioCtx.state === 'running') { audioCtx.suspend(); btn.innerText = 'Play Brown Noise'; isPlaying = false; }
                    else { audioCtx.resume(); btn.innerText = 'Stop Noise'; isPlaying = true; }
                }
            };
            return () => { cancelAnimationFrame(anim); if(audioCtx) audioCtx.close(); };
        }
    };
</script>
