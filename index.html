<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art for Health Toolkit</title>
    <style>
        /* BASE & AESTHETIC (mrdoob inspired minimalism) */
        :root {
            --bg: #f8f9fa;
            --text: #111;
            --accent: #d0d0d0;
            --highlight: #0055ff;
            --font-main: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            overflow: hidden; /* Prevent body scroll, handle inside containers */
            -webkit-font-smoothing: antialiased;
        }

        /* HOME / DIRECTORY VIEW */
        #directory {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        header {
            margin-bottom: 40px;
            max-width: 800px;
        }

        header h1 {
            font-size: 24px;
            font-weight: 500;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
        }

        .item-link {
            padding: 20px;
            border: 1px solid var(--accent);
            cursor: pointer;
            background: #fff;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
        }

        .item-link:hover {
            border-color: var(--text);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .item-link .num {
            font-family: var(--font-mono);
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }

        .item-link .title {
            font-size: 16px;
            font-weight: 500;
        }

        /* APP / CANVAS VIEW */
        #app-view {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 20;
        }

        #app-view.active {
            opacity: 1;
            pointer-events: all;
        }

        #rubric-panel {
            width: 300px;
            background: var(--bg);
            border-right: 1px solid var(--accent);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .back-btn {
            font-family: var(--font-mono);
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            margin-bottom: 40px;
            display: inline-block;
            align-self: flex-start;
        }
        .back-btn:hover { color: var(--highlight); }

        .rubric-content h2 { font-size: 20px; margin-bottom: 20px; }
        .rubric-section { margin-bottom: 20px; }
        .rubric-section h3 { font-size: 11px; text-transform: uppercase; color: #888; margin-bottom: 5px; font-family: var(--font-mono); }
        .rubric-section p { font-size: 14px; line-height: 1.5; }

        #canvas-container {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
        }

        /* UTILITY CLASSES FOR APPS */
        .hidden { display: none !important; }
        .full-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* --- APP SPECIFIC STYLES --- */
        /* 1. Breathe */
        .breathe-circle {
            width: 200px; height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, #e0eaf5 0%, #b3cce6 100%);
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-mono); font-size: 14px;
            transition: all 0.1s;
        }
        
        /* 2. Brain Dump */
        #dump-ui { display: flex; flex-direction: column; width: 80%; max-width: 600px; z-index: 2;}
        #dump-text { width: 100%; height: 200px; padding: 20px; font-family: var(--font-mono); font-size: 16px; border: 1px solid #ddd; resize: none; margin-bottom: 10px; outline: none; background: transparent;}
        #dump-btn { padding: 10px; background: #111; color: #fff; border: none; cursor: pointer; font-family: var(--font-mono); }
        .falling-word { position: absolute; font-family: var(--font-mono); color: #333; pointer-events: none; opacity: 1; filter: blur(0px); transform: scale(1); }

        /* 5. Affirmation Cards */
        .card-container { perspective: 1000px; width: 300px; height: 400px; cursor: pointer; }
        .card { width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; position: relative;}
        .card.is-flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; padding: 30px; text-align: center; border: 1px solid #ccc; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-radius: 8px;}
        .card-back { transform: rotateY(180deg); background: #fafafa; font-size: 18px; line-height: 1.4; }
        .card-front { background: repeating-linear-gradient(45deg, #f0f0f0, #f0f0f0 10px, #fff 10px, #fff 20px); font-family: var(--font-mono); font-size: 24px;}

        /* 6. Mind Map */
        .mm-node { position: absolute; padding: 10px 15px; background: #fff; border: 1px solid #333; border-radius: 20px; cursor: grab; user-select: none; font-size: 14px; box-shadow: 2px 2px 0 #333;}
        .mm-node:active { cursor: grabbing; }

        /* 11. Desk Blob */
        .blob {
            width: 300px; height: 300px;
            background: #ffecb3;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            transition: border-radius 0.2s ease, transform 0.1s ease;
            box-shadow: inset -20px -20px 40px rgba(0,0,0,0.05);
            cursor: pointer;
        }

        /* 15. Audio Controls */
        #audio-controls { position: absolute; bottom: 40px; text-align: center; z-index: 2; }
        .audio-btn { padding: 12px 24px; border: 1px solid #111; background: #fff; cursor: pointer; border-radius: 30px; font-family: var(--font-mono); }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            #app-view { flex-direction: column-reverse; }
            #rubric-panel { width: 100%; height: 40%; border-right: none; border-top: 1px solid var(--accent); padding: 15px; }
            #canvas-container { height: 60%; }
        }
    </style>
</head>
<body>

    <!-- DIRECTORY / HOME -->
    <div id="directory">
        <header>
            <h1>Art for Health Toolkit</h1>
            <div style="font-family: var(--font-mono); font-size: 12px; color: #888; margin-bottom: 15px; text-transform: uppercase;">By Darwin</div>
            <p>A digital social prescription project designed to combat academic burnout. 15 interactive interventions. Click any module to begin.</p>
        </header>
        <div id="grid"></div>
        <div style="margin-top: 50px; text-align: center; font-family: var(--font-mono); font-size: 10px; color: #ccc; width: 100%; max-width: 1200px; padding-bottom: 20px;">
            M <span style="color: #ff6b6b;">&hearts;</span>
        </div>
    </div>

    <!-- APP / INTERACTION VIEW -->
    <div id="app-view">
        <div id="rubric-panel">
            <div class="back-btn" onclick="closeApp()">← Return to Directory</div>
            <div class="rubric-content">
                <h2 id="rubric-title">Title</h2>
                <div class="rubric-section">
                    <h3>The Purpose</h3>
                    <p id="rubric-purpose">...</p>
                </div>
                <div class="rubric-section">
                    <h3>Why Included?</h3>
                    <p id="rubric-why">...</p>
                </div>
                <div class="rubric-section">
                    <h3>Desired Effect</h3>
                    <p id="rubric-effect">...</p>
                </div>
            </div>
        </div>
        <div id="canvas-container">
            <!-- Dynamic app content injected here -->
        </div>
    </div>

<script>
    // --- TOOLKIT DATA & RUBRIC ---
    const toolkitData = [
        {
            id: 'breathe',
            title: '1. The Breathing Canvas',
            purpose: 'To guide the user through the 4-7-8 physiological breathing technique visually.',
            why: 'Stress causes shallow breathing. A visual metronome removes the cognitive load of counting.',
            effect: 'Lowers heart rate and activates the parasympathetic nervous system.'
        },
        {
            id: 'dump',
            title: '2. Cognitive Dissolve',
            purpose: 'A digital space to type out intrusive thoughts and watch them physically fall apart.',
            why: 'Holding onto immediate stressors causes mental fatigue. Externalizing them creates distance.',
            effect: 'Provides closure, mental clarity, and reduced rumination.'
        },
        {
            id: 'gen-art',
            title: '3. Symmetry Sandbox',
            purpose: 'A generative drawing tool that creates perfect symmetry from messy mouse movements.',
            why: 'Perfectionism blocks creativity in students. This tool guarantees a "beautiful" outcome with zero skill.',
            effect: 'Induces a gentle flow state and builds creative confidence.'
        },
        {
            id: 'coloring',
            title: '4. Generative Stained Glass',
            purpose: 'A digital coloring exercise using randomly generated geometric patterns.',
            why: 'Engaging the motor system safely with a repetitive, low-stakes task grounds the brain.',
            effect: 'Acts as a mindfulness anchor, pulling focus away from abstract academic anxiety.'
        },
        {
            id: 'cards',
            title: '5. Tactile Affirmations',
            purpose: 'A clickable, 3D digital card deck offering reframes for common student anxieties.',
            why: 'Students often suffer from impostor syndrome and catastrophic thinking during finals.',
            effect: 'Interrupts negative self-talk with logical, visually pleasing reassurance.'
        },
        {
            id: 'mindmap',
            title: '6. Chaos Organizer',
            purpose: 'An infinite canvas to double-click, type, and drag concepts around freely.',
            why: 'Overwhelm stems from disorganized information. Spatial mapping helps the brain process volume.',
            effect: 'Restores a sense of control and spatial memory organization.'
        },
        {
            id: 'origami',
            title: '7. Digital Fold Focus',
            purpose: 'A step-by-step visual sequencer that requires the user to click to progress through geometric forms.',
            why: 'Focusing entirely on a sequence of shapes forces the brain into single-tasking.',
            effect: 'Breaks the cycle of multitasking and creates a micro-accomplishment.'
        },
        {
            id: 'texture',
            title: '8. Texture Reveal',
            purpose: 'A scratch-off canvas that reveals a calming organic texture underneath.',
            why: 'Academic life is smooth glass screens. The brain craves the discovery of texture.',
            effect: 'Provides sensory grounding and a metaphor for uncovering clarity.'
        },
        {
            id: 'vision',
            title: '9. Growth Tracker',
            purpose: 'A visual tool where clicking grows a digital plant leaf-by-leaf.',
            why: 'Academic burnout makes the future look bleak. Visualizing incremental growth restores perspective.',
            effect: 'Fosters hope and visualizes the value of small, daily efforts.'
        },
        {
            id: 'particles',
            title: '10. Constellation Connect',
            purpose: 'A gentle interactive particle system where nodes connect to your cursor.',
            why: 'Watching organic, interconnected movement mimics natural systems like stars or fireflies.',
            effect: 'Promotes soft fascination, giving the active mind a place to rest without boredom.'
        },
        {
            id: 'blob',
            title: '11. Digital Desk Clay',
            purpose: 'A highly reactive, squishy digital shape that reacts to mouse physics.',
            why: 'Restless energy needs a kinetic outlet during long reading assignments.',
            effect: 'Somatic soothing and harmless physical distraction.'
        },
        {
            id: 'magnetic',
            title: '12. Magnetic Field',
            purpose: 'A grid of particles that smoothly repel and spring back as you move your mouse.',
            why: 'Interacting with responsive, elastic digital materials provides a satisfying sense of tactile feedback.',
            effect: 'Reduces frustration by offering a highly responsive, non-judgmental environment.'
        },
        {
            id: 'balance',
            title: '13. Stacking Stones',
            purpose: 'A simple physics interaction: click to drop blocks and build a precarious tower.',
            why: 'Adulthood lacks unstructured play. Balancing requires delicate focus.',
            effect: 'Encourages lightheartedness and acceptance of failure (when the tower falls).'
        },
        {
            id: 'asmr',
            title: '14. Visual Pendulum',
            purpose: 'A mathematically perfect, endlessly decaying sine wave drawing (Harmonograph).',
            why: 'Smooth, predictable visual tracking helps regulate the nervous system (similar to EMDR).',
            effect: 'Hypnotic relaxation and heart rate reduction.'
        },
        {
            id: 'sound-draw',
            title: '15. Soundscape Sketch',
            purpose: 'Generates soothing procedural white noise while providing a blank drawing space.',
            why: 'Auditory masking helps eliminate distracting background noise in dorms.',
            effect: 'Creates a safe psychological bubble for deep focus or rest.'
        }
    ];

    // --- CORE LOGIC ---
    const grid = document.getElementById('grid');
    const directory = document.getElementById('directory');
    const appView = document.getElementById('app-view');
    const canvasContainer = document.getElementById('canvas-container');
    let currentAppCleanup = null; // Function to run when closing an app

    // Build Menu
    toolkitData.forEach((item, index) => {
        const el = document.createElement('div');
        el.className = 'item-link';
        el.innerHTML = `
            <div class="num">NO. ${(index + 1).toString().padStart(2, '0')}</div>
            <div class="title">${item.title.split('. ')[1]}</div>
        `;
        el.onclick = () => openApp(item);
        grid.appendChild(el);
    });

    function openApp(item) {
        // Update Rubric Text
        document.getElementById('rubric-title').innerText = item.title;
        document.getElementById('rubric-purpose').innerText = item.purpose;
        document.getElementById('rubric-why').innerText = item.why;
        document.getElementById('rubric-effect').innerText = item.effect;

        // Clear container
        canvasContainer.innerHTML = '';
        if (currentAppCleanup) currentAppCleanup();
        
        // Launch specific app logic
        currentAppCleanup = appInitializers[item.id]();

        // UI Transition
        directory.style.opacity = '0';
        directory.style.pointerEvents = 'none';
        appView.classList.add('active');
    }

    function closeApp() {
        if (currentAppCleanup) currentAppCleanup();
        currentAppCleanup = null;
        canvasContainer.innerHTML = '';
        appView.classList.remove('active');
        directory.style.opacity = '1';
        directory.style.pointerEvents = 'all';
    }

    // --- MINI APP IMPLEMENTATIONS ---

    const appInitializers = {
        // 1. Breathe (CSS Animation)
        'breathe': () => {
            const circle = document.createElement('div');
            circle.className = 'breathe-circle';
            canvasContainer.appendChild(circle);

            let state = 0; // 0: in, 1: hold, 2: out
            let cycleTimeout;
            let counterInterval;

            function runCycle() {
                clearInterval(counterInterval);
                let timeLeft;
                if(state === 0) {
                    circle.style.transform = 'scale(2)';
                    circle.style.background = 'radial-gradient(circle, #e0eaf5 0%, #8db3dc 100%)';
                    timeLeft = 4;
                    circle.innerText = `Breathe In (${timeLeft})`;
                    circle.style.transition = 'transform 4s linear, background 4s';
                    counterInterval = setInterval(() => {
                        timeLeft--;
                        if(timeLeft > 0) circle.innerText = `Breathe In (${timeLeft})`;
                    }, 1000);
                    cycleTimeout = setTimeout(() => { state = 1; runCycle(); }, 4000);
                } else if(state === 1) {
                    timeLeft = 7;
                    circle.innerText = `Hold (${timeLeft})`;
                    counterInterval = setInterval(() => {
                        timeLeft--;
                        if(timeLeft > 0) circle.innerText = `Hold (${timeLeft})`;
                    }, 1000);
                    cycleTimeout = setTimeout(() => { state = 2; runCycle(); }, 7000);
                } else if(state === 2) {
                    circle.style.transform = 'scale(1)';
                    circle.style.background = 'radial-gradient(circle, #e0eaf5 0%, #b3cce6 100%)';
                    timeLeft = 8;
                    circle.innerText = `Breathe Out (${timeLeft})`;
                    circle.style.transition = 'transform 8s linear, background 8s';
                    counterInterval = setInterval(() => {
                        timeLeft--;
                        if(timeLeft > 0) circle.innerText = `Breathe Out (${timeLeft})`;
                    }, 1000);
                    cycleTimeout = setTimeout(() => { state = 0; runCycle(); }, 8000);
                }
            }
            setTimeout(runCycle, 100);
            return () => {
                clearTimeout(cycleTimeout);
                clearInterval(counterInterval);
            };
        },

        // 2. Brain Dump (Physics Text)
        'dump': () => {
            const ui = document.createElement('div');
            ui.id = 'dump-ui';
            ui.innerHTML = `
                <textarea id="dump-text" placeholder="Type what is stressing you out right now..."></textarea>
                <button id="dump-btn">Dissolve Thoughts</button>
            `;
            canvasContainer.appendChild(ui);

            const btn = document.getElementById('dump-btn');
            const txt = document.getElementById('dump-text');

            btn.onclick = () => {
                const words = txt.value.split(/\s+/);
                const rect = txt.getBoundingClientRect();
                txt.value = '';
                
                words.forEach((word) => {
                    if(!word) return;
                    const el = document.createElement('div');
                    el.className = 'falling-word';
                    el.innerText = word;
                    el.style.left = (rect.left + Math.random() * rect.width * 0.8) + 'px';
                    el.style.top = (rect.top + Math.random() * rect.height * 0.8) + 'px';
                    
                    // Organic timing: delay 0-3s, duration 10-15s
                    const delay = Math.random() * 3;
                    const duration = 10 + Math.random() * 5;
                    el.style.transition = `transform ${duration}s ease-out ${delay}s, opacity ${duration * 0.8}s ease-in ${delay}s, filter ${duration}s ease-in ${delay}s`;
                    
                    canvasContainer.appendChild(el);
                    
                    // Animate
                    setTimeout(() => {
                        const rX = (Math.random() - 0.5) * 800; // Drift widely horizontally
                        const rY = (Math.random() - 0.5) * 800 - 200; // Drift in all directions, slight upward bias
                        const rRot = (Math.random() - 0.5) * 720;
                        const rScale = 2 + Math.random() * 4; // Expand as it fades
                        
                        el.style.transform = `translate(${rX}px, ${rY}px) rotate(${rRot}deg) scale(${rScale})`;
                        el.style.opacity = '0';
                        el.style.filter = 'blur(15px)'; // Dissolve into blur
                    }, 50);

                    setTimeout(() => el.remove(), (duration + delay) * 1000 + 100);
                });
            };
            return () => {};
        },

        // 3. Symmetry Sandbox (Canvas)
        'gen-art': () => {
            const cvs = document.createElement('canvas');
            cvs.className = 'full-canvas';
            canvasContainer.appendChild(cvs);
            const ctx = cvs.getContext('2d');
            
            let w, h;
            function resize() { w = cvs.width = canvasContainer.clientWidth; h = cvs.height = canvasContainer.clientHeight; }
            resize();
            window.addEventListener('resize', resize);

            let isDrawing = false;
            let lastX = 0, lastY = 0;
            let hue = 0;

            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            function draw(e) {
                if(!isDrawing) return;
                const rect = cvs.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                ctx.strokeStyle = `hsl(${hue}, 70%, 50%)`;
                ctx.lineWidth = 2;

                const drawLine = (x1,y1, x2,y2) => {
                    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
                };

                // 4-way symmetry
                drawLine(lastX, lastY, x, y);
                drawLine(w - lastX, lastY, w - x, y);
                drawLine(lastX, h - lastY, x, h - y);
                drawLine(w - lastX, h - lastY, w - x, h - y);

                lastX = x; lastY = y; hue++;
            }

            cvs.addEventListener('mousedown', (e) => { isDrawing = true; const r = cvs.getBoundingClientRect(); lastX = e.clientX - r.left; lastY = e.clientY - r.top; });
            cvs.addEventListener('mousemove', draw);
            cvs.addEventListener('mouseup', () => isDrawing = false);
            cvs.addEventListener('mouseout', () => isDrawing = false);

            return () => { window.removeEventListener('resize', resize); };
        },

        // 4. Stained Glass (Canvas Flood Fill / Polygons)
        'coloring': () => {
            const cvs = document.createElement('canvas');
            cvs.className = 'full-canvas';
            canvasContainer.appendChild(cvs);
            const ctx = cvs.getContext('2d');
            
            let w = cvs.width = canvasContainer.clientWidth;
            let h = cvs.height = canvasContainer.clientHeight;
            
            // Generate random intersecting lines to make polygons
            const lines = [];
            for(let i=0; i<15; i++) {
                lines.push({
                    x1: Math.random()*w, y1: Math.random()*h > h/2 ? 0 : h,
                    x2: Math.random()*w > w/2 ? 0 : w, y2: Math.random()*h
                });
            }

            const colors = ['#f4a261', '#e76f51', '#2a9d8f', '#e9c46a', '#ffffff', '#264653'];
            let colorIdx = 0;

            // Draw base
            ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
            ctx.strokeStyle = '#222'; ctx.lineWidth = 4;
            
            function renderLines() {
                lines.forEach(l => {
                    ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke();
                });
            }
            renderLines();

            // Simple "flood fill" simulation using shapes is complex in raw canvas without a library.
            // Alternative approach: Draw random colored polygons visually.
            cvs.addEventListener('click', (e) => {
                const rect = cvs.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                // Draw a circle of color instead of pure flood fill for reliability
                ctx.fillStyle = colors[colorIdx];
                ctx.beginPath();
                ctx.arc(x, y, 40 + Math.random()*40, 0, Math.PI*2);
                ctx.fill();
                ctx.stroke(); // re-outline
                
                // Redraw lines over top
                renderLines();

                colorIdx = (colorIdx + 1) % colors.length;
            });

            return () => {};
        },

        // 5. Affirmation Cards
        'cards': () => {
            const phrases = [
                "Your worth is not tied to your productivity.",
                "A B-minus is a completely acceptable outcome.",
                "Rest is not a reward, it is a requirement.",
                "You are allowed to do this poorly.",
                "One bad assignment does not derail your future."
            ];
            let idx = 0;

            const wrap = document.createElement('div');
            wrap.className = 'card-container';
            wrap.innerHTML = `
                <div class="card">
                    <div class="card-face card-front">DRAW<br>CARD</div>
                    <div class="card-face card-back">${phrases[0]}</div>
                </div>
            `;
            canvasContainer.appendChild(wrap);

            const card = wrap.querySelector('.card');
            const back = wrap.querySelector('.card-back');

            wrap.onclick = () => {
                if(card.classList.contains('is-flipped')) {
                    // flip back
                    card.classList.remove('is-flipped');
                    setTimeout(() => {
                        idx = (idx + 1) % phrases.length;
                        back.innerText = phrases[idx];
                    }, 300); // change text while hidden
                } else {
                    card.classList.add('is-flipped');
                }
            };
            return () => {};
        },

        // 6. Mind Map (Draggable Divs)
        'mindmap': () => {
            const hint = document.createElement('div');
            hint.style.cssText = 'position:absolute; top: 20px; color:#888; pointer-events:none; font-family: monospace;';
            hint.innerText = "Double-click anywhere to create a node. Drag to move.";
            canvasContainer.appendChild(hint);

            let dragEl = null;
            let ox = 0, oy = 0;

            canvasContainer.addEventListener('dblclick', (e) => {
                if(e.target !== canvasContainer) return;
                const node = document.createElement('div');
                node.className = 'mm-node';
                node.contentEditable = true;
                node.innerText = 'New Thought';
                
                const rect = canvasContainer.getBoundingClientRect();
                node.style.left = (e.clientX - rect.left) + 'px';
                node.style.top = (e.clientY - rect.top) + 'px';
                
                canvasContainer.appendChild(node);
                node.focus();

                node.addEventListener('mousedown', (me) => {
                    dragEl = node;
                    ox = me.offsetX; oy = me.offsetY;
                });
            });

            const onMove = (e) => {
                if(!dragEl) return;
                const rect = canvasContainer.getBoundingClientRect();
                dragEl.style.left = (e.clientX - rect.left - ox) + 'px';
                dragEl.style.top = (e.clientY - rect.top - oy) + 'px';
            };
            const onUp = () => dragEl = null;

            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);

            return () => {
                window.removeEventListener('mousemove', onMove);
                window.removeEventListener('mouseup', onUp);
            };
        },

        // 7. Fold Focus
        'origami': () => {
            const shape = document.createElement('div');
            shape.style.cssText = 'width: 200px; height: 200px; background: #333; transition: clip-path 1s ease-in-out; cursor:pointer;';
            
            const states = [
                'polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)', // Square
                'polygon(0% 0%, 100% 100%, 100% 100%, 0% 100%)', // Triangle
                'polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)', // Diamond
                'polygon(50% 0%, 100% 100%, 50% 80%, 0% 100%)' // Dart
            ];
            let sIdx = 0;
            shape.style.clipPath = states[sIdx];
            
            const hint = document.createElement('div');
            hint.innerText = "Click the shape to fold";
            hint.style.cssText = 'position:absolute; bottom: 40px; font-family: monospace; color:#666;';

            shape.onclick = () => {
                sIdx = (sIdx + 1) % states.length;
                shape.style.clipPath = states[sIdx];
            };

            canvasContainer.appendChild(shape);
            canvasContainer.appendChild(hint);
            return () => {};
        },

        // 8. Digital Rubbing (Scratch off)
        'texture': () => {
            canvasContainer.style.background = 'repeating-radial-gradient(circle at 0 0, transparent 0, #f8f9fa 10px), repeating-linear-gradient(#e5e5e5, #e5e5e5)';
            
            const cvs = document.createElement('canvas');
            cvs.className = 'full-canvas';
            canvasContainer.appendChild(cvs);
            const ctx = cvs.getContext('2d');
            
            let w = cvs.width = canvasContainer.clientWidth;
            let h = cvs.height = canvasContainer.clientHeight;

            // Fill top layer
            ctx.fillStyle = '#222';
            ctx.fillRect(0,0,w,h);
            
            // Text instructions
            ctx.fillStyle = '#666';
            ctx.font = '20px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('Click and drag to reveal texture', w/2, h/2);

            ctx.globalCompositeOperation = 'destination-out'; // Makes drawings transparent

            let isDrawing = false;
            cvs.onmousedown = () => isDrawing = true;
            cvs.onmouseup = () => isDrawing = false;
            cvs.onmousemove = (e) => {
                if(!isDrawing) return;
                const rect = cvs.getBoundingClientRect();
                ctx.beginPath();
                ctx.arc(e.clientX - rect.left, e.clientY - rect.top, 30, 0, Math.PI*2);
                ctx.fill();
            };

            return () => { canvasContainer.style.background = '#fff'; };
        },

        // 9. Growth Tracker
        'vision': () => {
            const cvs = document.createElement('canvas');
            cvs.className = 'full-canvas';
            canvasContainer.appendChild(cvs);
            const ctx = cvs.getContext('2d');
            let w = cvs.width = canvasContainer.clientWidth;
            let h = cvs.height = canvasContainer.clientHeight;

            let clickCount = 0;
            
            const hint = document.createElement('div');
            hint.innerText = "Click anywhere to grow";
            hint.style.cssText = 'position:absolute; top: 20px; font-family: monospace; color:#888; pointer-events:none;';
            canvasContainer.appendChild(hint);

            // Draw initial stem
            ctx.strokeStyle = '#2d6a4f';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(w/2, h);
            ctx.lineTo(w/2, h - 50);
            ctx.stroke();

            let currentY = h - 50;

            cvs.addEventListener('click', () => {
                clickCount++;
                const newY = currentY - 30;
                
                // Draw stem growth
                ctx.beginPath();
                ctx.moveTo(w/2, currentY);
                ctx.lineTo(w/2, newY);
                ctx.stroke();

                // Draw leaf
                const dir = clickCount % 2 === 0 ? 1 : -1;
                ctx.fillStyle = '#40916c';
                ctx.beginPath();
                ctx.ellipse(w/2 + (20 * dir), newY + 10, 20, 10, (dir * Math.PI/4), 0, Math.PI*2);
                ctx.fill();

                currentY = newY;
                if(currentY < 50) currentY = h - 50; // reset
            });

            return () => {};
        },

        // 10. Constellation Connect
        'particles': () => {
            const cvs = document.createElement('canvas');
            cvs.className = 'full-canvas';
            canvasContainer.appendChild(cvs);
            const ctx = cvs.getContext('2d');
            let w, h;
            function resize() { w = cvs.width = canvasContainer.clientWidth; h = cvs.height = canvasContainer.clientHeight; }
            resize();
            window.addEventListener('resize', resize);

            const pts = [];
            for(let i=0; i<100; i++) pts.push({x: Math.random()*w, y: Math.random()*h, vx: (Math.random()-0.5)*1.5, vy: (Math.random()-0.5)*1.5});
            
            let mouse = {x: -1000, y: -1000};
            cvs.onmousemove = e => { const r = cvs.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; };
            cvs.onmouseleave = () => { mouse.x = -1000; mouse.y = -1000; };

            let anim;
            function draw() {
                ctx.clearRect(0,0,w,h);
                ctx.fillStyle = '#ccc';
                pts.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    if(p.x < 0 || p.x > w) p.vx *= -1;
                    if(p.y < 0 || p.y > h) p.vy *= -1;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
                });
                
                ctx.strokeStyle = '#aaa';
                for(let i=0; i<pts.length; i++) {
                    // Connect to mouse
                    let dMouse = Math.hypot(pts[i].x - mouse.x, pts[i].y - mouse.y);
                    if(dMouse < 150) {
                        ctx.lineWidth = 1 - (dMouse/150);
                        ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
                    }
                    // Connect to each other
                    for(let j=i+1; j<pts.length; j++) {
                        let d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
                        if(d < 80) {
                            ctx.lineWidth = 1 - (d/80);
                            ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke();
                        }
                    }
                }
                anim = requestAnimationFrame(draw);
            }
            draw();
            return () => { cancelAnimationFrame(anim); window.removeEventListener('resize', resize); };
        },

        // 11. Digital Desk Clay
        'blob': () => {
            const blob = document.createElement('div');
            blob.className = 'blob';
            canvasContainer.appendChild(blob);

            const onMove = (e) => {
                const rect = blob.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                // Distort border radius based on mouse pos relative to blob center
                if(x > 0 && x < rect.width && y > 0 && y < rect.height) {
                    const r1 = 30 + (x/rect.width)*40;
                    const r2 = 30 + (y/rect.height)*40;
                    blob.style.borderRadius = `${r1}% ${100-r1}% ${r2}% ${100-r2}% / ${r2}% ${100-r1}% ${r1}% ${100-r2}%`;
                }
            };
            canvasContainer.addEventListener('mousemove', onMove);

            // Return to normal on mouse leave
            blob.addEventListener('mouseleave', () => {
                 blob.style.borderRadius = '40% 60% 70% 30% / 40% 50% 60% 50%';
            });

            return () => canvasContainer.removeEventListener('mousemove', onMove);
        },

        // 12. Magnetic Field
        'magnetic': () => {
            const cvs = document.createElement('canvas');
            cvs.className = 'full-canvas';
            canvasContainer.appendChild(cvs);
            const ctx = cvs.getContext('2d');
            let w, h;
            function resize() { w = cvs.width = canvasContainer.clientWidth; h = cvs.height = canvasContainer.clientHeight; }
            resize();
            window.addEventListener('resize', resize);

            const cols = 25; const rows = 15;
            const dots = [];
            
            function initDots() {
                dots.length = 0;
                let spacex = w / cols; 
                let spacey = h / rows;
                for(let i=1; i<cols; i++) {
                    for(let j=1; j<rows; j++) {
                        dots.push({ ox: i*spacex, oy: j*spacey, x: i*spacex, y: j*spacey, vx:0, vy:0 });
                    }
                }
            }
            initDots();
            window.addEventListener('resize', initDots);

            let mouse = {x: -1000, y: -1000};
            cvs.onmousemove = e => { const r = cvs.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; };
            cvs.onmouseleave = () => { mouse.x = -1000; mouse.y = -1000; };

            let anim;
            function draw() {
                ctx.clearRect(0,0,w,h);
                ctx.fillStyle = '#111';
                dots.forEach(p => {
                    let dx = mouse.x - p.x;
                    let dy = mouse.y - p.y;
                    let dist = Math.hypot(dx, dy);
                    if(dist < 120) {
                        let force = (120 - dist) / 120;
                        p.vx -= (dx / dist) * force * 1.5;
                        p.vy -= (dy / dist) * force * 1.5;
                    }
                    // spring back to original
                    p.vx += (p.ox - p.x) * 0.05;
                    p.vy += (p.oy - p.y) * 0.05;
                    // friction
                    p.vx *= 0.8;
                    p.vy *= 0.8;
                    p.x += p.vx;
                    p.y += p.vy;

                    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
                });
                anim = requestAnimationFrame(draw);
            }
            draw();
            return () => { 
                cancelAnimationFrame(anim); 
                window.removeEventListener('resize', resize); 
                window.removeEventListener('resize', initDots); 
            };
        },

        // 13. Stacking Stones
        'balance': () => {
            const cvs = document.createElement('canvas');
            cvs.className = 'full-canvas';
            canvasContainer.appendChild(cvs);
            const ctx = cvs.getContext('2d');
            let w = cvs.width = canvasContainer.clientWidth;
            let h = cvs.height = canvasContainer.clientHeight;

            const blocks = [];
            
            const hint = document.createElement('div');
            hint.innerText = "Click to drop a stone";
            hint.style.cssText = 'position:absolute; top: 20px; font-family: monospace; color:#888; pointer-events:none;';
            canvasContainer.appendChild(hint);

            function draw() {
                ctx.clearRect(0,0,w,h);
                // Draw base
                ctx.fillStyle = '#222';
                ctx.fillRect(w/2 - 50, h - 20, 100, 20);

                blocks.forEach(b => {
                    ctx.save();
                    ctx.translate(b.x, b.y);
                    ctx.rotate(b.angle);
                    ctx.fillStyle = b.color;
                    // Draw irregular poly roughly size of rect
                    ctx.beginPath();
                    ctx.rect(-b.w/2, -b.h/2, b.w, b.h);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                });
            }

            // Pseudo physics loop
            const iv = setInterval(() => {
                for(let i=0; i<blocks.length; i++) {
                    let b = blocks[i];
                    if(!b.settled) {
                        b.y += 5; // gravity
                        
                        // Check collision with ground
                        if(b.y + b.h/2 >= h - 20) {
                            b.y = h - 20 - b.h/2;
                            b.settled = true;
                        }
                        
                        // Check collision with block below it
                        if(i > 0) {
                            let below = blocks[i-1];
                            if(below.settled && Math.abs(b.x - below.x) < (b.w/2 + below.w/2)) {
                                if(b.y + b.h/2 >= below.y - below.h/2) {
                                    b.y = below.y - below.h/2 - b.h/2;
                                    b.settled = true;
                                    // Slight tilt based on offset
                                    b.angle = (b.x - below.x) * 0.01;
                                    // if offset is too huge, tower falls (clear array)
                                    if(Math.abs(b.x - below.x) > b.w * 0.8) {
                                        blocks.length = 0; // fall!
                                    }
                                }
                            }
                        }
                    }
                }
                draw();
            }, 1000/60);

            cvs.addEventListener('click', (e) => {
                const rect = cvs.getBoundingClientRect();
                blocks.push({
                    x: e.clientX - rect.left,
                    y: 0,
                    w: 40 + Math.random()*30,
                    h: 30 + Math.random()*20,
                    angle: (Math.random()-0.5)*0.2,
                    color: `hsl(${Math.random()*360}, 20%, 70%)`,
                    settled: false
                });
            });

            return () => clearInterval(iv);
        },

        // 14. Visual Pendulum (Harmonograph)
        'asmr': () => {
            const cvs = document.createElement('canvas');
            cvs.className = 'full-canvas';
            canvasContainer.appendChild(cvs);
            const ctx = cvs.getContext('2d');
            let w = cvs.width = canvasContainer.clientWidth;
            let h = cvs.height = canvasContainer.clientHeight;

            let t = 0;
            const f1 = 2, f2 = 2.01, p1 = Math.PI/2, p2 = 0, d1 = 0.001, d2 = 0.001;
            const amp = Math.min(w,h) * 0.4;

            ctx.translate(w/2, h/2);
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.lineWidth = 1;

            ctx.beginPath();
            
            const iv = setInterval(() => {
                for(let i=0; i<10; i++) { // speed up drawing
                    let x = amp * Math.sin(t * f1 + p1) * Math.exp(-d1 * t);
                    let y = amp * Math.sin(t * f2 + p2) * Math.exp(-d2 * t);
                    
                    if(t === 0) ctx.moveTo(x,y);
                    else ctx.lineTo(x,y);
                    
                    t += 0.05;
                }
                ctx.stroke();
            }, 16);

            return () => clearInterval(iv);
        },

        // 15. Soundscape Sketch
        'sound-draw': () => {
            // Audio Setup (Web Audio API)
            let audioCtx = null;
            let noiseNode = null;
            let filterNode = null;
            let isPlaying = false;

            const ui = document.createElement('div');
            ui.id = 'audio-controls';
            ui.innerHTML = `<button class="audio-btn">Play Brown Noise</button>`;
            canvasContainer.appendChild(ui);
            const btn = ui.querySelector('button');

            // Canvas Drawing Setup
            const cvs = document.createElement('canvas');
            cvs.className = 'full-canvas';
            cvs.style.zIndex = '1';
            canvasContainer.appendChild(cvs);
            const ctx = cvs.getContext('2d');
            let w = cvs.width = canvasContainer.clientWidth;
            let h = cvs.height = canvasContainer.clientHeight;

            let isDrawing = false;
            ctx.strokeStyle = '#ddd'; ctx.lineWidth = 2; ctx.lineCap = 'round';
            
            cvs.onmousedown = (e) => { isDrawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); };
            cvs.onmousemove = (e) => { if(isDrawing) { ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); } };
            cvs.onmouseup = () => isDrawing = false;
            cvs.onmouseout = () => isDrawing = false;

            btn.onclick = () => {
                if(!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    // Create Brown Noise
                    const bufferSize = audioCtx.sampleRate * 2; // 2 seconds
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const output = buffer.getChannelData(0);
                    let lastOut = 0;
                    for (let i = 0; i < bufferSize; i++) {
                        let white = Math.random() * 2 - 1;
                        output[i] = (lastOut + (0.02 * white)) / 1.02;
                        lastOut = output[i];
                        output[i] *= 3.5; // (roughly) compensate for gain
                    }
                    noiseNode = audioCtx.createBufferSource();
                    noiseNode.buffer = buffer;
                    noiseNode.loop = true;

                    // Lowpass filter for "muffled" rain sound
                    filterNode = audioCtx.createBiquadFilter();
                    filterNode.type = 'lowpass';
                    filterNode.frequency.value = 400;

                    noiseNode.connect(filterNode);
                    filterNode.connect(audioCtx.destination);
                    noiseNode.start(0);
                    isPlaying = true;
                    btn.innerText = 'Stop Noise';
                } else {
                    if(audioCtx.state === 'running') {
                        audioCtx.suspend();
                        btn.innerText = 'Play Brown Noise';
                    } else {
                        audioCtx.resume();
                        btn.innerText = 'Stop Noise';
                    }
                }
            };

            return () => {
                if(audioCtx) audioCtx.close();
            };
        }
    };

</script>
